[package]
name = "nova"
version = "0.1.0"
description = "Nova – local-first music player"
authors = ["Nova Contributors"]
edition = "2021"
default-run = "nova"
rust-version = "1.77.2"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-nova-mobile = { path = "plugins/nova-mobile" }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
walkdir = "2"
sha1 = "0.10"
dunce = "1"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"] }
cpal = "0.16"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "wav", "pcm"] }
songrec-lib = "0.5.4"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"

# reqwest's `rustls` feature verifies through Android's Java TrustManager, which
# needs a Kotlin helper plus JNI init that Nova does not ship. Build the media
# HTTP client with bundled webpki roots on Android instead (see http::client_builder).
[target.'cfg(target_os = "android")'.dependencies]
rustls = "0.23"
webpki-roots = "1"
