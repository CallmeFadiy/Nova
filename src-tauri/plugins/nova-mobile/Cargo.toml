[package]
name = "tauri-plugin-nova-mobile"
version = "0.1.0"
description = "Nova Android native bridge"
authors = ["Nova Contributors"]
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-nova-mobile"
build = "build.rs"

[lib]
name = "tauri_plugin_nova_mobile"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
